name: Keep Supabase awake

on:
  schedule:
    # Supabase pauses Free plan projects after 7 days of low activity and
    # expects a few database requests per day, not a single weekly ping.
    # Off-the-hour minutes avoid the scheduler's peak-load delays.
    - cron: '23 7 * * *'
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # get_public_tournaments is the security-definer function granted to the
      # anon role, so the publishable key is the only credential required.
      - name: Ping public tournaments endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY repository secret." >&2
            exit 1
          fi

          endpoint="${SUPABASE_URL%/}/rest/v1/rpc/get_public_tournaments"

          for attempt in 1 2 3; do
            status="$(curl \
              --silent \
              --show-error \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "apikey: ${SUPABASE_KEY}" \
              "${endpoint}")" || status='000'

            if [ "${status}" = '200' ]; then
              echo "Supabase responded 200 on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt} returned HTTP ${status}." >&2

            if [ "${attempt}" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done

          echo 'Supabase keep-alive failed. The project may be paused or the endpoint may have changed.' >&2
          exit 1
